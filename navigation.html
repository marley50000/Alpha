<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor Navigation</title>
    <link rel="stylesheet" href="navigation.css">
</head>
<body>
    <h1>Indoor Navigation</h1>
    <div id="map-container">
        <!-- SVG map will be loaded here -->
    </div>
    <div id="controls">
        <select id="destination-select">
            <option value="">Select a destination</option>
        </select>
        <button id="navigate-button">Navigate</button>
        <button id="start-tracking-button">Start Tracking</button>
        <button id="optical-sync-button">Optical Sync</button>
    </div>
    <div id="instructions">
        <p>Instructions will appear here.</p>
    </div>
    <script src="graph.js"></script>
    <script src="navigation.js"></script>
</body>
</html>
