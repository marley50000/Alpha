<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f0f0f0"/>

  <!-- Walls -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="black" stroke-width="2"/>
  <rect x="250" y="50" width="2" height="200" fill="black"/>
  <rect x="500" y="250" width="250" height="2" fill="black"/>
  <rect x="250" y="400" width="300" height="2" fill="black"/>

  <!-- Rooms -->
  <text x="150" y="150" font-family="sans-serif" font-size="20" text-anchor="middle">Room 1</text>
  <text x="375" y="150" font-family="sans-serif" font-size="20" text-anchor="middle">Room 2</text>
  <text x="625" y="150" font-family="sans-serif" font-size="20" text-anchor="middle">Room 3</text>
  <text x="150" y="350" font-family="sans-serif" font-size="20" text-anchor="middle">Corridor</text>
  <text x="375" y="500" font-family="sans-serif" font-size="20" text-anchor="middle">Room 4</text>
  <text x="625" y="350" font-family="sans-serif" font-size="20" text-anchor="middle">Room 5</text>
</svg>